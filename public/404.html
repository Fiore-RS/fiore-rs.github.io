<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>fiorers.dev</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      // fiorers.dev se sirve desde la raíz, así que no se conserva ningún segmento.
      // /zobro/ es un repo aparte y GitHub lo sirve antes de llegar acá. /teleo/ también: desde
      // nov 2026 Teleo vive en teleo.fiorers.dev y GitHub redirige solo de /teleo/ al subdominio.
      // /sobres/ (nombre viejo de Zobro) es una carpeta de este repo: public/sobres/.
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>

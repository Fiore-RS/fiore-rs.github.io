<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>fiorers.dev</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      // fiorers.dev se sirve desde la raíz, así que no se conserva ningún segmento.
      // Las rutas /teleo/ y /sobres/ son repos aparte y GitHub las sirve antes de llegar acá.
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
